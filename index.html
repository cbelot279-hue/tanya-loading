<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tanya the Evil | Empire Roleplay</title>
<style> 

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background-color: #090b0e !important;
    background-image: url("https://cbelot279-hue.github.io/tanya-loading/tanya.jpg?v=2") !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
    background-size: cover !important;
}


*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090b0e;color:#eee8d8;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.back{position:fixed;inset:0;background:linear-gradient(90deg,rgba(7,9,12,.92) 0%,rgba(7,9,12,.42) 48%,rgba(7,9,12,.68) 100%),url('tanya.jpg') center center/cover no-repeat;filter:saturate(.82)}.back:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,7,9,.94),transparent 60%)}.edge{position:fixed;inset:18px;border:1px solid rgba(201,162,82,.55);pointer-events:none}.top{position:absolute;top:7%;left:7%;font-size:13px;letter-spacing:5px;color:#d4b46e;font-weight:bold}.main{position:absolute;left:7%;bottom:18%;max-width:850px}.line{width:85px;height:4px;background:#d4b46e;margin-bottom:22px}h1{font-size:clamp(34px,5vw,75px);letter-spacing:3px;margin:0;color:#f4e3b6;text-shadow:0 3px 20px #000}h2{font-size:clamp(16px,2vw,28px);letter-spacing:8px;color:#d4b46e;margin:12px 0 26px}p{font-size:16px;color:#e1d9c7;line-height:1.6}.footer{position:absolute;left:7%;right:7%;bottom:7%;display:flex;gap:25px;align-items:center}.load{flex:1}.status{font-size:13px;letter-spacing:1px;margin-bottom:12px;color:#eee1bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:8px;background:#222932;border:1px solid #786441}.bar{height:100%;width:0%;background:linear-gradient(90deg,#87682d,#e1bd6e);transition:width .3s}.small{font-size:12px;color:#c9bca1;white-space:nowrap}@media(max-width:650px){.top{top:9%}.main{bottom:23%}.footer{bottom:8%;display:block}.small{margin-top:12px}}
</style></head><body><div class="back"></div><div class="edge"></div><div class="top">ÉTAT-MAJOR IMPÉRIAL · TRANSMISSION OFFICIELLE</div><main class="main"><div class="line"></div><h1>TANYA THE EVIL</h1><h2>EMPIRE ROLEPLAY</h2><p>Bienvenue dans l'Empire.<br>Préparation de votre affectation en cours.</p></main><footer class="footer"><div class="load"><div class="status" id="status">Connexion au serveur impérial…</div><div class="track"><div class="bar" id="bar"></div></div></div><div class="small" id="meta">MANGARP · EMPIRE</div></footer>
<script>
(function(){var total=0,needed=0;function progress(){if(total>0){var pct=Math.max(0,Math.min(100,Math.round((total-needed)/total*100)));document.getElementById('bar').style.width=pct+'%';}}window.GameDetails=function(servername,serverurl,mapname,maxplayers,steamid,gamemode,volume,language){document.getElementById('meta').textContent=(mapname||'EMPIRE')+' · '+(gamemode||'MANGARP');};window.SetFilesTotal=function(n){total=Number(n)||0;needed=total;progress();};window.SetFilesNeeded=function(n){needed=Number(n)||0;progress();};window.SetStatusChanged=function(s){document.getElementById('status').textContent=s||'Connexion en cours…';};window.DownloadingFile=function(s){document.getElementById('status').textContent='Téléchargement : '+(s||'fichiers du serveur');};})();
</script>
<!-- MUSIQUE IMPERIALE - TANYA THE EVIL -->
<audio id="imperial-music" loop preload="auto">
    <source src="./intro.mp3.mp3" type="audio/mpeg">
</audio>

<script>
(function () {
    var music = document.getElementById("imperial-music");
    music.volume = 0.30;

    function startMusic() {
        var result = music.play();

        if (result && result.catch) {
            result.catch(function () {
                console.log("Lecture automatique bloquee.");
            });
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startMusic);
    } else {
        startMusic();
    }
})();
</script>
</body></html>
